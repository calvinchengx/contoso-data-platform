# This repo's own environment. The generators are NOT listed here: they are
# installed by `make fixtures` from the pinned release, because which release
# they came from is the thing under test.
[project]
name = "contoso-data-platform"
version = "0.1.0"
description = "A complete analytics platform on a released fabric-emulator"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    # The ERP source is a real Postgres, and its change stream is real Kafka.
    "psycopg[binary]>=3.2,<4",
    # The source specs are YAML; the catalog derives its entities from them
    # rather than restating what the vendor already published.
    "pyyaml>=6,<7",
    "confluent-kafka>=2.6,<3",
    "pyarrow>=18,<24",
    # The THIN Spark Connect client — about a megabyte, and no JVM. The full
    # pyspark distribution is not needed to drive a Connect server.
    "pyspark-client==4.1.1",
]

[dependency-groups]
# Locked, not resolved fresh on every run: `--with pytest` would pull whatever
# version exists that day, which is a different test suite than the one that
# passed yesterday.
# pytest floor is 9.0.3, not 8: everything below it has GHSA-tied tmpdir
# handling that Dependabot flags on this public repo. The upper bound stays,
# for the reason above.
dev = ["pytest>=9.0.3,<10", "ruff>=0.14,<0.15", "ty>=0.0.1a1"]

[tool.uv]
package = false

# Astral's toolchain throughout: uv resolves, ruff lints and formats, ty checks
# types. One vendor, one config file, and every contributor gets the same
# versions because they are in uv.lock.
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # import order
    "UP",            # pyupgrade — this repo is >=3.12, so say so
    "B",             # bugbear
    "SIM",           # simplify
    "PTH",           # pathlib over os.path: the one that actually bites on Windows
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# A Fabric notebook is not an ordinary module, and the two ways it differs are
# both things ruff is right to flag anywhere else.
#
#   F821  `spark` and `notebook_exit` are injected by the HOST. Fabric's Spark
#         pool binds them in production and engine.py binds them against the
#         emulator; declaring them here would shadow the real session with a
#         stub, which is worse than the warning.
#   E402  cells are executed in order, so imports belong in the cell that first
#         needs them — a notebook whose imports are all hoisted to the top is
#         no longer a notebook.
#
# Scoped by FILENAME rather than by path, because the notebook now lives where
# Fabric's Git integration puts it — `definitions/{name}.{Type}/notebook-content.py`
# — and a path-scoped ignore would have to be re-edited for every notebook this
# platform grows. Every other module in platform/ is ordinary Python and keeps
# both rules.
"**/notebook-content.py" = ["F821", "E402"]

[tool.ty.environment]
# The steps import each other as top-level modules because each one also runs
# standalone (`python platform/silver.py`), which puts platform/ on sys.path.
# ty needs telling, or a sibling import resolves to nothing.
extra-paths = ["platform"]

[tool.ty.rules]
# The generators arrive from a wheel installed outside the lock, so ty cannot
# see them when it runs on a clean checkout. Their absence is not a type error.
unresolved-import = "ignore"

[[tool.ty.overrides]]
# The notebook's `spark` and `notebook_exit` come from the HOST, not from an
# import — Fabric's Spark pool binds them in production, engine.py does against
# the emulator. Declaring them to satisfy the checker would shadow the real
# session with a stub, which is a worse file than a suppressed rule.
#
# Scoped to the notebook. Everywhere else an undefined name is a real bug, and
# this is the module most likely to acquire one, so the suppression is as
# narrow as the tooling allows rather than switched off repo-wide.
include = ["platform/silver_notebook.py"]

[tool.ty.overrides.rules]
unresolved-reference = "ignore"

[tool.pytest.ini_options]
# `make test` promises no emulator, no Docker and no fixture wheels, so the few
# tests that genuinely need a wheel are marked rather than skipped. `make test`
# deselects them and `make test-fixtures` runs them in the acceptance workflow,
# where `make fixtures` has installed the pinned release. A deselection is
# counted and named; a skip reads like success.
markers = [
    "fixtures: needs the published fixture wheels (`make fixtures`)",
]
