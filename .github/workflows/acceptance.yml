# The claim this repository exists to make: a PUBLISHED fabric-emulator carries
# a whole platform, from real source systems to Power BI.
name: Acceptance

on:
  # Fired by fabric-emulator's release workflow.
  repository_dispatch:
    types: [fabric-emulator-release]
  # THE GUARD. A dispatch that silently fails to fire — revoked token, renamed
  # event type, workflow auto-disabled after 60 days of inactivity — is
  # indistinguishable from one that fired and passed. The schedule makes that
  # absence loud within a day.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  verify:
    name: Verify the released emulator end to end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-platform-notebook-pipelines
    # To push the adopted pin back. The repository default is read-only, and a
    # job that only ever reads should stay that way — this one does not.
    permissions:
      contents: write
    steps:
      # Full history, and a token the later push can use. The default checkout
      # is a depth-1 detached HEAD, which cannot rebase onto a moved main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: fabric-platform-notebook-pipelines
      # THE VENDORS. Declared in contoso-sources and materialised from it, so
      # `make sources` delegates to that checkout rather than carrying a copy.
      # This platform used to hold its own duplicate of every spec and serve.js;
      # they were byte-identical, which is exactly why nothing noticed they
      # could drift.
      - uses: actions/checkout@v7
        with:
          repository: calvinchengx/contoso-sources
          path: contoso-sources
      # THE PRODUCT THIS PLATFORM RUNS. A separate repository: this one stands
      # up the emulator, the product is what runs on it. Without PRODUCT the
      # default is the empty ./product mount point.
      - uses: actions/checkout@v7
        with:
          repository: calvinchengx/contoso-data-product-fabric-notebook-pipelines
          path: contoso-data-product-fabric-notebook-pipelines
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # VERIFY THE RELEASE THAT FIRED, not the pin in the checkout. A dispatch
      # for 0.13.1 that ran against the 0.13.0 in versions.env would report
      # success — in the emulator's own release history — for a release nobody
      # tested. The payload is what makes this run about the new version.
      #
      # Only on dispatch: the schedule and manual runs verify the pin, which is
      # the other thing worth knowing (does the version we claim to support
      # still work today?).
      # WHICH VERSION THIS RUN IS ABOUT.
      #
      # On a dispatch it is the release that fired. On the schedule it is the
      # NEWEST release, resolved here rather than assumed to be the pin.
      #
      # THAT IS WHAT MAKES THE DISPATCH OPTIONAL. A cross-repository dispatch
      # needs a token with write on every platform, and when that token expires
      # or is under-scoped the platforms go quiet with nothing to say so. Polling
      # costs a day of latency and no secret at all, so the dispatch is now an
      # optimisation for immediacy rather than the only way this runs.
      #
      # When the platform is already current, `latest` equals the pin and this
      # behaves exactly as the schedule did before: it answers "does the version
      # we claim to support still work today?".
      - name: Resolve the version to verify
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            version="${{ github.event.client_payload.version }}"
            echo "dispatched for $version"
          else
            version=$(gh release view --repo calvinchengx/fabric-emulator \
                        --json tagName -q .tagName | sed 's/^v//')
            echo "newest release is $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Point at that version
        run: |
          uv run --no-project python scripts/set_release.py "${{ steps.target.outputs.version }}"
          git --no-pager diff --stat versions.env
      - run: make sources
      - run: make doctor
      - run: make fixtures
      # The tests `make test` deselects because they need these wheels. Here
      # the wheels exist, so they run rather than reading as absent.
      - run: make test-fixtures
      - run: make up
      - run: make verify PRODUCT=../contoso-data-product-fabric-notebook-pipelines
      # ADOPT WHAT THIS RUN JUST PROVED. Everything above already ran against
      # the dispatched version — `set_release.py` rewrote versions.env in the
      # runner before `make up` — so by here the pin has been verified end to
      # end and is still sitting uncommitted in the working tree. Throwing it
      # away and asking a human to retype it is the only thing separating a
      # verified release from an adopted one.
      #
      # No `if: always()`. A step with no condition runs only when every step
      # before it succeeded, which is exactly the gate wanted: a red run must
      # leave the pin where it is.
      #
      # Only on dispatch. The schedule and manual runs verify the EXISTING pin
      # and have nothing to adopt — `set_release.py` never ran, so versions.env
      # is unchanged and the guard below would exit anyway. Saying so here
      # keeps the intent readable rather than incidental.
      # ADOPT WHENEVER THE PIN MOVED, not only on a dispatch. A scheduled run
      # that verified a newer release end to end has proved exactly what a
      # dispatched one proves, and throwing that away would mean the pin only
      # ever advances when a cross-repository token happens to be working.
      - name: Adopt the version this run just verified
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Attributed to the bot, not to a person. `git log` should show at a
          # glance which pins a human chose and which a passing run adopted.

          # A re-dispatch of a version already pinned — a re-run of an old
          # release workflow — has nothing to say.
          if git diff --quiet versions.env; then
            echo "already pinned at $VERSION; nothing to adopt"
            exit 0
          fi

          git commit -qm "pin $VERSION — adopted by the acceptance run that verified it" versions.env
          # main can move during the ~8 minutes this run takes. Without the
          # rebase the push races and fails, and the release looks broken for a
          # reason that has nothing to do with the release.
          git pull --rebase --quiet origin main
          git push origin HEAD:main
          echo "adopted $VERSION" >> "$GITHUB_STEP_SUMMARY"
      # Report what was VERIFIED, not merely that nothing failed. "We verified
      # 0.13.1" is a positive statement; "nothing went red" is not, and the
      # difference is precisely what a stale trigger hides.
      - if: always()
        run: uv run --no-project python scripts/summarise.py >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: make down
