# The source systems. NOT the emulator — this is the world outside it.
#
# Kept in its own file so the boundary is legible from the layout alone: what
# is a Fabric emulator and what is a vendor a Fabric pipeline pulls from.
#
# ONE mokapi PER VENDOR, never one shared instance multiplexing several specs.
# Two different companies do not share a process in production, and every way
# the shared shape leaks is a way this platform would teach something false:
#
#   an outage is not shared     Contoso POS falling over must not take Contoso
#                               Web with it — which a single instance does, and
#                               which is how mokapi's OOM under a 170 MB body
#                               would have become a platform-wide failure.
#   a blast radius is real      each vendor gets its OWN memory budget, sized to
#                               its OWN payload, rather than one ceiling that is
#                               either too small for the largest or wasteful for
#                               the rest.
#   a mount is a boundary       a vendor is handed ONLY its own spec and its own
#                               bytes. It is not possible for Contoso POS to
#                               serve Contoso Web's export by a path typo,
#                               because that path is not in its container.
#   an address is a system      a vendor is reached at its own host:port, which
#                               is what changes — and all that changes — when
#                               this is pointed at the real company.
#
# Adding a vendor is copying one block and giving it the next port pair.
# `test_one_mokapi_instance_per_source` fails if a spec appears without one.
services:
  # --- Contoso POS: the vendor's export API --------------------------------
  mokapi-pos:
    image: mokapi/mokapi:${MOKAPI_VERSION:?see versions.env}
    command:
      # The dashboard keeps every request AND its response body in memory. For
      # a 95 MB export that is a 246 MB JSON copy retained per call — measured,
      # not estimated — so the history is capped at one entry per API. The
      # dashboard still shows the last call, which is all it is used for here.
      - --event-store-default-size=1
      - /sources/contoso-pos/openapi.yaml
      - /sources/contoso-pos/serve.js
    environment:
      # Go does NOT read the cgroup limit. Without this the runtime assumes it
      # can grow, lets the heap climb past `mem_limit`, and the container is
      # terminated mid-response — which is what `restart: unless-stopped` was
      # quietly papering over. Measured: 7 large requests killed it without
      # this, 24 ran clean with it. Set below mem_limit so the GC has room to
      # work rather than at the ceiling where it has none.
      GOMEMLIMIT: 2GiB
    volumes:
      # Read-only, and SCOPED TO THIS VENDOR: its spec and its bytes, nothing
      # else. `make sources` materialises them from the published generators.
      - ../sources/contoso-pos:/sources/contoso-pos:ro
      - ../sources/_data/contoso-pos:/sources/_data/contoso-pos:ro
    # An EXPLICIT ceiling, because the implicit one killed it. `read()` holds
    # the whole body in a JS string — UTF-16, so ~2x the 170 MB file — and the
    # container was OOMKilled with 15 GB free on the host, which points at a
    # per-container default rather than host pressure. Stating the budget makes
    # the failure reproducible instead of dependent on the runtime's defaults.
    # Sized to THIS vendor's export; another vendor sets its own.
    mem_limit: 4g
    # A vendor that dies mid-run should come back, and its death should be
    # visible rather than surfacing as `Connection refused` three steps later.
    # NOTE: this is a seatbelt, not the fix. It restarted 4 times across a
    # session and every run still passed, because a fresh mokapi answers the
    # next request — so the policy hid a real defect behind a green pipeline.
    # GOMEMLIMIT above is the fix; keep this for genuine crashes only.
    restart: unless-stopped
    # HEALTHY MEANS THE VENDOR ENFORCES ITS CREDENTIAL, not merely that a port
    # is open. If serve.js cannot read its fixture — `make sources` not run, a
    # bad mount — mokapi does not fail: it falls back to GENERATING bodies from
    # the OpenAPI schema and answers every request 200, wrong key included.
    # A liveness probe passes happily against that, and the lie surfaces three
    # steps later as "the vendor accepted a bad API key", which names neither
    # mokapi nor the missing files.
    #
    # So the probe sends a key that must be refused. wget exits non-zero on
    # 401, which is the healthy case here — hence the inverted test.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null --header='X-Api-Key: definitely-not-the-key'
          http://localhost:8090/api/v1/export/customers && exit 1 || exit 0
      interval: 10s
      timeout: 5s
      retries: 5
    # NON-DEFAULT HOST PORTS, deliberately. 8080 is the most contended port on
    # a developer machine and 5432 is the second — a native Postgres service
    # silently won the race against this stack's container and produced
    # `role "contoso" does not exist`, an error that names neither port nor
    # process. Container-side ports stay standard; only what we publish moves.
    # Each vendor owns a pair: 1809x for its API, 1808x for its dashboard.
    ports:
      - "${POS_API_PORT:-18090}:8090"   # the vendor's API
      - "${POS_UI_PORT:-18081}:8080"    # its mokapi dashboard

  # --- Contoso Web: the storefront's export API -----------------------------
  # ITS OWN INSTANCE, not another spec on mokapi-pos. Two vendors are two
  # companies: one process serving both makes a single outage everyone's, puts
  # both exports under one memory ceiling, and hands each vendor the other's
  # bytes to serve by a path typo. `test_one_mokapi_instance_per_source`
  # enforces it.
  mokapi-web:
    image: mokapi/mokapi:${MOKAPI_VERSION:?see versions.env}
    command:
      - --event-store-default-size=1
      - /sources/contoso-web/openapi.yaml
      - /sources/contoso-web/serve.js
    environment:
      # Go does not read the cgroup limit; see mokapi-pos for the measurement.
      # Lower here because this vendor's pages are smaller — its whole export
      # is 36 MB against the POS system's 170 MB.
      GOMEMLIMIT: 1GiB
    volumes:
      - ../sources/contoso-web:/sources/contoso-web:ro
      - ../sources/_data/contoso-web:/sources/_data/contoso-web:ro
    # Sized to THIS vendor's export, as mokapi-pos's comment says each should
    # be. `read()` holds a page as a UTF-16 JS string, so budget ~2x the 8 MB
    # page plus mokapi's own footprint — 2g is generous, not tight.
    mem_limit: 2g
    restart: unless-stopped
    # Healthy means the vendor REFUSES a bad key. If serve.js cannot read its
    # fixture, mokapi silently falls back to generating bodies from the schema
    # and answers everything 200 — including a wrong key. wget exits non-zero
    # on 401, which is the healthy case, hence the inverted test.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null --header='X-Api-Key: definitely-not-the-key'
          http://localhost:8091/api/v2/export/customers && exit 1 || exit 0
      interval: 10s
      timeout: 5s
      retries: 5
    # The next pair, per mokapi-pos's rule: 1809x for the API, 1808x for the
    # dashboard.
    ports:
      - "${WEB_API_PORT:-18091}:8091"   # the vendor's API
      - "${WEB_UI_PORT:-18082}:8080"    # its mokapi dashboard

  # --- Contoso ERP: a relational source, captured ---------------------------
  # POS and Web publish file-shaped exports, so a REST endpoint is the honest
  # transport for them. ERP is different in kind: it is a database that changes,
  # and its whole reason for being in this platform is that CDC and SCD2 become
  # real rather than aspirational. A Parquet file DESCRIBING a change log is a
  # simulation of that; a table with Debezium on it is the thing itself.
  erp-postgres:
    image: postgres:${POSTGRES_VERSION:?see versions.env}
    # wal_level=logical is not tuning — without it Postgres emits no logical
    # replication stream at all and Debezium's connector fails at creation with
    # a message about replication slots that does not name this setting.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_USER: contoso
      POSTGRES_PASSWORD: contoso-erp-dev
      POSTGRES_DB: erp
    ports: ["${ERP_POSTGRES_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contoso -d erp"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:?see versions.env}
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      # TWO LISTENERS, and both are needed. A broker tells clients where to
      # reconnect, so a single `redpanda:9092` advertisement is correct for
      # Debezium (on the compose network) and unusable from the host, which
      # cannot resolve that name. The failure is `Host resolution failure` from
      # librdkafka — a message that names the symptom, not the listener.
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
    ports: ["${REDPANDA_PORT:-19092}:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  debezium:
    image: debezium/connect:${DEBEZIUM_VERSION:?see versions.env}
    depends_on:
      erp-postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: contoso-erp
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      # One partition each: ordering per key is what CDC guarantees, and more
      # partitions would trade that away for throughput this does not need.
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports: ["${DEBEZIUM_PORT:-18083}:8083"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
