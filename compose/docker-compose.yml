# The emulator family, at a PINNED release — never `latest`.
#
# This repository exists to verify that a published fabric-emulator carries a
# whole platform. `latest` would make a green run unattributable: you would know
# something worked, but not which release.
#
# THREE VARIABLES, NOT ONE. The family ships on independent cadences —
# fabric-emulator is at 0.13.x while entra and keyvault are at 0.3.x — so a
# single pin cannot describe the stack. versions.env holds all of them and
# compose reads it directly with --env-file.
#
# Deliberately NOT copied from fabric-emulator's own compose file. That one is
# for people building the emulator; this one is what a consumer writes from the
# published docs, which is the thing this repo is here to prove is possible.
name: contoso-data-platform

services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:?see versions.env}
    environment:
      ORIGIN_MODE: compat
      PUBLIC_ORIGIN: "https://entra-emulator:8443"
    ports: ["8443:8443"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  keyvault-emulator:
    image: ghcr.io/calvinchengx/azure-keyvault-emulator:${KEYVAULT_EMULATOR_VERSION:?see versions.env}
    depends_on:
      entra-emulator: {condition: service_healthy}
    ports: ["8444:8444"]
    environment:
      KV_ENTRA_ISSUER: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      KV_ENTRA_TLS_INSECURE: "true"
      # The image bakes KV_DATA_DIR=/data for volume users; no volume here, so
      # this must be emptied or the store fails to open a path that is not there.
      KV_DATA_DIR: ""

  fabric-emulator:
    image: ghcr.io/calvinchengx/fabric-emulator:${FABRIC_EMULATOR_VERSION:?see versions.env}
    depends_on:
      entra-emulator: {condition: service_healthy}
    # api.fabric + onelake.dfs + the portal, including the #flow view the
    # capture harness records while the pipeline runs.
    ports: ["9443:9443"]
    environment:
      FABRIC_ENTRA_ISSUER: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      FABRIC_ENTRA_JWKS_URL: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/discovery/v2.0/keys"
      FABRIC_ENTRA_TLS_INSECURE: "true"
      FABRIC_DATA_DIR: ""

# Source systems (mokapi, Postgres, Redpanda, Debezium) and OpenMetadata arrive
# in later phases. They are the world OUTSIDE the emulator and will live in
# their own compose files, composed in by the Makefile — so that what is
# emulator and what is source stays legible from the file layout alone.

  # --- Spark, because the platform must scale -------------------------------
  # bronze and silver are distributed transforms. In real Fabric they run in a
  # Spark notebook or a Spark Job Definition on a Spark pool; here they run
  # against Sail, the same engine the emulator's own advanced examples use.
  #
  # The PUBLISHED image, not a build: this repository is a consumer and may only
  # use what a consumer can pull.
  sail:
    image: ghcr.io/calvinchengx/fabric-emulator-sail:${SAIL_VERSION:?see versions.env}
    depends_on:
      fabric-emulator: {condition: service_healthy}
    ports:
      - "${SAIL_PORT:-50051}:50051"   # Spark Connect, plain h2c gRPC
    environment:
      # Sail mints its own storage token before starting: Rust object_store
      # reads credentials from the process environment at startup only, so a
      # Connect client cannot hand it one later.
      ENTRA_TOKEN_URL: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "cccccccc-0000-0000-0000-000000000002"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "https://fabric-emulator:9443/onelake"
      AZURE_ALLOW_INVALID_CERTIFICATES: "true"
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"
